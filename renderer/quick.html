<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Быстрая заметка</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body { background: var(--bg-secondary); border-radius: 10px; overflow: hidden; }

    .quick-wrap {
      display: flex; flex-direction: column; height: 100vh;
      border-radius: 10px; border: 1px solid var(--border-light);
      overflow: hidden; position: relative;
    }

    /* Заголовок */
    .quick-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px 8px;
      background: var(--bg-secondary); border-bottom: 1px solid var(--border);
      -webkit-app-region: drag; flex-shrink: 0;
    }
    .header-title {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-secondary); font-weight: 500;
    }
    .close-btn {
      -webkit-app-region: no-drag;
      background: transparent; color: var(--text-muted);
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; border: none; cursor: pointer;
    }
    .close-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

    /* Панель форматирования */
    .format-toolbar {
      display: flex; align-items: center; gap: 1px;
      padding: 4px 8px; background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0; -webkit-app-region: no-drag;
    }
    .fmt-btn {
      display: flex; align-items: center; justify-content: center;
      padding: 0; width: 26px; height: 26px;
      background: transparent; color: var(--text-secondary);
      border: none; border-radius: 4px; font-size: 13px; cursor: pointer;
      transition: background .1s, color .1s; flex-shrink: 0;
    }
    .fmt-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .fmt-btn.active { background: rgba(245,197,24,.15); color: var(--accent); }
    .fmt-btn b { font-weight: 800; font-size: 14px; }
    .fmt-btn i { font-style: italic; font-size: 14px; }
    .fmt-btn u { text-decoration: underline; font-size: 13px; }
    .fmt-btn s { text-decoration: line-through; font-size: 13px; }
    .fmt-sep { width: 1px; height: 16px; background: var(--border); margin: 0 3px; flex-shrink: 0; }
    .color-btn { position: relative; }
    .color-btn input[type="color"] { position: absolute; width: 0; height: 0; opacity: 0; top: 100%; left: 0; padding: 0; border: 0; }
    .color-icon { font-weight: 700; font-size: 13px; line-height: 1; }
    .color-bar { display: block; width: 14px; height: 2.5px; border-radius: 1px; margin-top: 1px; background: #f5735a; }

    /* Область текста */
    .note-content {
      flex: 1; padding: 12px 14px; font-size: 14px; line-height: 1.7;
      color: var(--text-primary); background: var(--bg-secondary);
      outline: none; overflow-y: auto; word-break: break-word; min-height: 80px;
    }
    .note-content.is-empty::before {
      content: attr(data-placeholder); color: var(--text-muted);
      pointer-events: none; display: block;
    }
    .note-content ul { padding-left: 22px; margin: 4px 0; }
    .note-content ol { padding-left: 22px; margin: 4px 0; }
    .note-content li { margin: 2px 0; }
    .note-content blockquote { border-left: 3px solid var(--border-light); padding-left: 12px; margin: 6px 0; color: var(--text-secondary); font-style: italic; }
    .note-content hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
    .note-content strong { font-weight: 700; }
    .note-content em { font-style: italic; }
    .note-content u { text-decoration: underline; }
    .note-content s { text-decoration: line-through; }

    /* Сворачиваемые фото */
    .photos-section { flex-shrink: 0; }
    .photos-toggle {
      display: none; align-items: center; gap: 6px; width: 100%;
      padding: 6px 12px; background: var(--bg-secondary);
      border: none; border-top: 1px solid var(--border);
      color: var(--text-secondary); font-size: 12px; cursor: pointer; text-align: left;
    }
    .photos-section.has-photos .photos-toggle { display: flex; }
    .photos-toggle:hover { background: var(--bg-hover); color: var(--text-primary); }
    .photos-chevron { margin-left: auto; transition: transform 0.2s; flex-shrink: 0; }
    .photos-section.expanded .photos-chevron { transform: rotate(180deg); }
    .photo-grid { display: none; flex-wrap: wrap; gap: 8px; padding: 8px 12px; background: var(--bg-secondary); }
    .photos-section.expanded .photo-grid { display: flex; }
    .photo-item { position: relative; width: 66px; height: 66px; }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
    .photo-item .del-photo {
      position: absolute; top: 2px; right: 2px;
      background: rgba(0,0,0,.7); color: #fff;
      border: none; width: 16px; height: 16px; border-radius: 50%;
      font-size: 9px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* Список аудио (сворачиваемый) */
    .audios-section { flex-shrink: 0; }
    .audios-toggle {
      display: none; align-items: center; gap: 6px; width: 100%;
      padding: 6px 12px; background: var(--bg-secondary);
      border: none; border-top: 1px solid rgba(82,194,82,.25);
      color: var(--text-secondary); font-size: 12px; cursor: pointer; text-align: left;
    }
    .audios-section.has-audios .audios-toggle { display: flex; }
    .audios-toggle:hover { background: var(--bg-hover); color: var(--text-primary); }
    .audios-chevron { margin-left: auto; transition: transform 0.2s; flex-shrink: 0; }
    .audios-section.expanded .audios-chevron { transform: rotate(180deg); }
    .audios-list { display: none; }
    .audios-section.expanded .audios-list { display: block; }
    .audio-item {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 12px;
      background: rgba(82,194,82,.06); border-top: 1px solid rgba(82,194,82,.13);
    }
    .audio-item:first-child { border-top: none; }
    .audio-item svg { flex-shrink: 0; color: var(--text-muted); }
    .audio-item audio { flex: 1; height: 26px; }
    .remove-audio-item {
      background: transparent; border: none; color: var(--text-muted);
      cursor: pointer; font-size: 14px; padding: 2px 5px;
      width: auto; border-radius: 3px; flex-shrink: 0;
    }
    .remove-audio-item:hover { color: var(--danger); background: rgba(224,82,82,.1); }

    /* Индикатор записи */
    .audio-indicator {
      display: none; align-items: center; gap: 8px;
      padding: 6px 12px;
      background: rgba(224,82,82,.08); border-top: 1px solid rgba(224,82,82,.18);
      font-size: 12px; color: var(--danger); flex-shrink: 0;
    }
    .audio-indicator.visible { display: flex; }
    .audio-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: pulse 1s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .audio-timer { font-variant-numeric: tabular-nums; }

    /* Оверлей drag */
    .drop-overlay {
      display: none; position: absolute; inset: 0;
      background: rgba(245,197,24,.08); border: 2px dashed var(--accent);
      border-radius: 10px; z-index: 10;
      align-items: center; justify-content: center;
      font-size: 14px; color: var(--accent); pointer-events: none;
    }
    .drop-overlay.visible { display: flex; }

    /* Нижняя панель */
    .quick-footer {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 12px; background: var(--bg-secondary);
      border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .footer-tools { display: flex; gap: 4px; flex: 1; }
    .tool-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 9px; background: transparent; color: var(--text-secondary);
      border: none; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer;
    }
    .tool-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .tool-btn.recording { color: var(--danger); background: rgba(224,82,82,.1); }
    .hint { font-size: 11px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="quick-wrap" id="dropZone">

    <div class="drop-overlay" id="dropOverlay">Отпустите для прикрепления фото</div>

    <div class="quick-header">
      <div class="header-title">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Быстрая заметка
      </div>
      <button class="close-btn" id="btnClose" title="Закрыть (Esc)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Панель форматирования (идентична редактору) -->
    <div class="format-toolbar">
      <button class="fmt-btn" data-cmd="undo" title="Отменить">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.96"/></svg>
      </button>
      <button class="fmt-btn" data-cmd="redo" title="Повторить">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-3.96"/></svg>
      </button>
      <div class="fmt-sep"></div>
      <button class="fmt-btn" data-cmd="bold" title="Жирный (Ctrl+B)"><b>B</b></button>
      <button class="fmt-btn" data-cmd="italic" title="Курсив (Ctrl+I)"><i>I</i></button>
      <button class="fmt-btn" data-cmd="underline" title="Подчёркнутый"><u>U</u></button>
      <button class="fmt-btn" data-cmd="strikeThrough" title="Зачёркнутый"><s>S</s></button>
      <div class="fmt-sep"></div>
      <label class="fmt-btn color-btn" title="Цвет текста">
        <span style="display:flex;flex-direction:column;align-items:center;gap:1px">
          <span class="color-icon">A</span>
          <span class="color-bar" id="colorBar"></span>
        </span>
        <input type="color" id="fmtColorInput" value="#f5735a" tabindex="-1">
      </label>
      <div class="fmt-sep"></div>
      <button class="fmt-btn" data-cmd="insertUnorderedList" title="Маркированный список">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.5" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="fmt-btn" data-cmd="insertOrderedList" title="Нумерованный список">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><polyline points="3 7 4 6 4 10" stroke-width="1.5"/><path d="M3 13h2m-2 2v-1.5a1 1 0 0 1 2 0v.5l-2 2.5h2" stroke-width="1.5"/></svg>
      </button>
      <button class="fmt-btn" data-cmd="formatBlock:blockquote" title="Цитата" style="font-style:italic;font-size:16px">"</button>
      <button class="fmt-btn" data-cmd="insertHorizontalRule" title="Разделитель" style="font-size:15px;letter-spacing:-1px">—</button>
      <div class="fmt-sep"></div>
      <button class="fmt-btn" data-cmd="removeFormat" title="Очистить форматирование">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/><line x1="3" y1="21" x2="7" y2="17"/></svg>
      </button>
    </div>

    <!-- Область ввода -->
    <div class="note-content is-empty" id="noteContent" contenteditable="true"
      data-placeholder="Напишите заметку…" spellcheck="true"></div>

    <!-- Сворачиваемые фото -->
    <div class="photos-section" id="photosSection">
      <button class="photos-toggle" id="photosToggle">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span id="photosLabel">0 фото</span>
        <svg class="photos-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="photo-grid" id="photoGrid"></div>
    </div>

    <!-- Список аудио (сворачиваемый) -->
    <div class="audios-section" id="audiosSection">
      <button class="audios-toggle" id="audiosToggle">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span id="audiosLabel">0 аудио</span>
        <svg class="audios-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="audios-list" id="audiosList"></div>
    </div>

    <!-- Индикатор записи -->
    <div class="audio-indicator" id="audioIndicator">
      <div class="audio-dot"></div>
      <span>Запись…</span>
      <span class="audio-timer" id="audioTimer">0:00</span>
      <button class="tool-btn recording" id="btnStop" style="margin-left:auto;font-size:12px">Стоп</button>
    </div>

    <!-- Нижняя панель -->
    <div class="quick-footer">
      <div class="footer-tools">
        <button class="tool-btn" id="btnPhoto">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Фото
        </button>
        <button class="tool-btn" id="btnAudio">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          Аудио
        </button>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="hint">Ctrl+Enter</span>
        <button class="btn-accent" id="btnSave">Сохранить</button>
      </div>
    </div>

  </div>
  <script src="quick.js"></script>
</body>
</html>
