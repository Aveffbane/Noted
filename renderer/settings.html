<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .settings-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Блок одной настройки */
    .setting-group {
      background: var(--bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 4px;
    }

    .setting-group-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 10px 14px 6px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      gap: 12px;
      border-top: 1px solid var(--border);
    }

    .setting-row:first-of-type {
      border-top: none;
    }

    .setting-label {
      font-size: 13px;
      color: var(--text-primary);
      flex: 1;
    }

    .setting-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Поле для горячей клавиши */
    .hotkey-input {
      width: 160px;
      text-align: center;
      font-family: 'Consolas', monospace;
      font-size: 13px;
      padding: 6px 10px;
      cursor: pointer;
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
    }

    .hotkey-input:focus {
      border-color: var(--accent);
      background: var(--bg-hover);
    }

    .hotkey-input.recording {
      border-color: var(--danger);
      color: var(--danger);
      animation: blink-border 1s infinite;
    }

    @keyframes blink-border {
      0%, 100% { border-color: var(--danger); }
      50% { border-color: transparent; }
    }

    /* Переключатель (toggle) */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--border-light);
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle input:checked + .toggle-slider {
      background: var(--accent);
    }

    .toggle input:checked + .toggle-slider::before {
      transform: translateX(18px);
    }

    /* Выбор темы */
    .theme-options {
      display: flex;
      gap: 6px;
    }

    .theme-option {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 12px;
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.15s;
    }

    .theme-option.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(245, 197, 24, 0.08);
    }

    .theme-option:hover:not(.active) {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    /* Нижняя кнопочная панель */
    .settings-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    /* Кнопка открыть папку */
    .link-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    .link-btn:hover {
      color: var(--accent-hover);
    }
  </style>
</head>
<body>

  <!-- Заголовок -->
  <div class="titlebar">
    <span class="titlebar-title">⚙️ Настройки</span>
    <div class="titlebar-actions">
      <button class="icon-btn" id="btnClose" title="Закрыть">✕</button>
    </div>
  </div>

  <div class="settings-body">

    <!-- Горячие клавиши -->
    <div class="setting-group">
      <div class="setting-group-title">Горячие клавиши</div>

      <div class="setting-row">
        <div>
          <div class="setting-label">Быстрая заметка</div>
          <div class="setting-desc">Открывает окно быстрого ввода</div>
        </div>
        <input
          type="text"
          class="hotkey-input"
          id="hotkeyQuick"
          readonly
          placeholder="Нажмите клавиши…"
          title="Кликните и нажмите желаемую комбинацию"
        >
      </div>

      <div class="setting-row">
        <div>
          <div class="setting-label">Список заметок</div>
          <div class="setting-desc">Открывает главное окно</div>
        </div>
        <input
          type="text"
          class="hotkey-input"
          id="hotkeyList"
          readonly
          placeholder="Нажмите клавиши…"
          title="Кликните и нажмите желаемую комбинацию"
        >
      </div>
    </div>

    <!-- Запуск с Windows -->
    <div class="setting-group">
      <div class="setting-group-title">Система</div>

      <div class="setting-row">
        <div>
          <div class="setting-label">Запускать при старте Windows</div>
          <div class="setting-desc">Приложение будет в трее после перезагрузки</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="autoLaunch">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="setting-row">
        <div>
          <div class="setting-label">Папка с данными</div>
          <div class="setting-desc">Заметки, фото и аудио хранятся здесь</div>
        </div>
        <button class="link-btn" id="btnOpenFolder">Открыть →</button>
      </div>
    </div>

    <!-- Тема -->
    <div class="setting-group">
      <div class="setting-group-title">Внешний вид</div>

      <div class="setting-row">
        <div class="setting-label">Тема оформления</div>
        <div class="theme-options">
          <button class="theme-option" data-theme="dark" id="themeDark">🌙 Тёмная</button>
          <button class="theme-option" data-theme="light" id="themeLight">☀️ Светлая</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Кнопки -->
  <div class="settings-footer">
    <button class="btn-ghost" id="btnCancel">Отмена</button>
    <button class="btn-accent" id="btnSave">Сохранить</button>
  </div>

  <script src="settings.js"></script>
</body>
</html>
